name: coders-modulo-4

services:
  postgres:
    image: postgres:18-alpine
    container_name: coders-modulo-4-postgres
    restart: unless-stopped
    ports:
      # Apenas loopback: o banco não é exposto à rede local.
      # Se a porta 5432 já estiver em uso na máquina, defina POSTGRES_PORT no .env.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coders_modulo_4}
    volumes:
      # PostgreSQL 18 mudou o volume padrão para /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  lgtm:
    image: grafana/otel-lgtm:0.39.0
    container_name: coders-modulo-4-lgtm
    restart: unless-stopped
    ports:
      - "3010:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/coders-modulo-4.yaml:ro
      - ./observability/dashboards:/otel-lgtm/custom-dashboards:ro
      - ./observability/lgtm-builtin-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

  # Métricas do PostgreSQL do Compose -> LGTM via OTLP.
  postgres-metrics:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: coders-modulo-4-postgres-metrics
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      lgtm:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coders_modulo_4}
    volumes:
      - ./observability/postgres-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  postgres-data:
