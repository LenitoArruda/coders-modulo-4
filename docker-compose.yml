name: coders-modulo-4

services:
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    container_name: coders-modulo-4-lgtm
    restart: unless-stopped
    ports:
      - "3010:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/coders-modulo-4.yaml:ro
      - ./observability/dashboards:/otel-lgtm/custom-dashboards:ro
      - ./observability/lgtm-builtin-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

  # Métricas do Postgres do Supabase local (porta 54322 do host) -> LGTM via OTLP.
  postgres-metrics:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: coders-modulo-4-postgres-metrics
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      - lgtm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
    volumes:
      - ./observability/postgres-collector.yaml:/etc/otelcol/config.yaml:ro
