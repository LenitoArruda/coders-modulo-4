# Coleta métricas do Postgres local (Supabase) e envia por OTLP para o LGTM.
# O banco fica em outra rede do Docker, então é acessado pela porta publicada no host.
receivers:
  postgresql:
    endpoint: host.docker.internal:54322
    transport: tcp
    username: postgres
    password: ${env:POSTGRES_PASSWORD}
    databases:
      - postgres
    collection_interval: 15s
    tls:
      insecure: true
    metrics:
      postgresql.database.locks:
        enabled: true
      postgresql.deadlocks:
        enabled: true
      postgresql.sequential_scans:
        enabled: true
      postgresql.temp_files:
        enabled: true
      postgresql.tup_returned:
        enabled: true
      postgresql.tup_fetched:
        enabled: true
      postgresql.tup_inserted:
        enabled: true
      postgresql.tup_updated:
        enabled: true
      postgresql.tup_deleted:
        enabled: true

processors:
  resource:
    attributes:
      - key: service.name
        value: supabase-postgres
        action: upsert
  batch: {}

exporters:
  otlp_grpc:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [postgresql]
      processors: [resource, batch]
      exporters: [otlp_grpc]
